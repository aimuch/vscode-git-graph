name: 'Build & Test'

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, Test & Package
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: npm
    - name: Check that the tag matches the version in package.json
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        VERSION="v$(node -p "require('./package.json').version")"
        if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
          echo "::error::The tag $GITHUB_REF_NAME doesn't match the version in package.json ($VERSION)"
          exit 1
        fi
    - run: npm ci
    - run: npm run compile
    - run: npm run test
    - name: Package the extension (VSIX)
      run: npm run package
    - uses: actions/upload-artifact@v4
      with:
        name: git-graph-vsix
        path: '*.vsix'
        if-no-files-found: error

  dev-release:
    name: Publish Development Build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: dev-release
      cancel-in-progress: true
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: git-graph-vsix
    - name: Replace the dev pre-release with this build
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release delete dev --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
        gh release create dev *.vsix --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
          --title "Development build (main@${GITHUB_SHA::7})" \
          --notes "The latest build of the main branch ($GITHUB_SHA). Install the VSIX with: code --install-extension <file> --force, or from the Extensions View (... > Install from VSIX...)."

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: git-graph-vsix
    - name: Create the release with the VSIX attached
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" *.vsix --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
